  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ site.seo.description }}" />
  <title>{{ site.seo.title }}</title>

  <!-- Canonical URL and share-image URLs are built from "url" in src/data/site.json. -->
  <link rel="canonical" href="{{ site.url }}/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="theme-color" content="#000000" />
  <meta name="author" content="{{ site.name }}" />

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{ site.name }}" />
  <meta property="og:title" content="{{ site.seo.shareTitle }}" />
  <meta property="og:description" content="{{ site.seo.ogDescription }}" />
  <meta property="og:url" content="{{ site.url }}/" />
  <meta property="og:image" content="{{ site.url }}{{ site.seo.shareImage }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ site.seo.shareImageAlt }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ site.seo.shareTitle }}" />
  <meta name="twitter:description" content="{{ site.seo.twitterDescription }}" />
  <meta name="twitter:image" content="{{ site.url }}{{ site.seo.shareImage }}" />

  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">

  <!-- Structured data. The business/person graph lives in src/data/structured-data.json;
       an Event is added automatically for every upcoming show in shows.json. -->
  <script type="application/ld+json">
{{{ jsonLd }}}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css" />
